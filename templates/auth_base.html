{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a3323">
    <title>{% block title %}FLORA{% endblock %}</title>

    <link rel="icon" type="image/png" href="{% static 'img/logoF.png' %}">
    
    <link rel="stylesheet" href="{% static 'css/tokens.css' %}?v=9">
    <link rel="stylesheet" href="{% static 'css/components.css' %}?v=9">
    <link rel="stylesheet" href="{% static 'css/auth.css' %}?v=9">
    <style>
        .auth-panel-art {
            right: -17%;
            bottom: -10%;
            width: min(104%, 860px);
            height: min(104%, 900px);
            opacity: .58;
        }

        .botanical-stem,
        .botanical-leaves,
        .botanical-flower {
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .botanical-stem {
            stroke: rgba(247, 244, 213, .23);
            stroke-width: 4.5;
        }

        .botanical-leaves {
            stroke: rgba(199, 214, 161, .34);
            stroke-width: 3.2;
        }

        .botanical-flower {
            stroke: rgba(235, 185, 175, .48);
            stroke-width: 3;
        }

        .botanical-flower .fine-line {
            stroke: rgba(247, 244, 213, .24);
            stroke-width: 1.6;
        }

        .input-password {
            position: relative;
            width: 100%;
        }

        .input-password input {
            width: 100%;
            padding-right: 92px;
        }

        .input-with-icon.input-password {
            display: flex;
            align-items: center;
            padding-right: 92px;
        }

        .input-with-icon.input-password input {
            flex: 1;
            min-width: 0;
            padding-right: 0;
        }

        .password-toggle {
            top: 50%;
            right: 14px;
            display: inline-flex;
            min-height: 32px;
            align-items: center;
            justify-content: center;
            transform: translateY(-50%);
        }
    </style>
    <script src="{% static 'js/auth.js' %}?v=9" defer></script>
    <script src="{% static 'js/smart-fields.js' %}?v=9" defer></script>
    {% block extra_head %}{% endblock %}
</head>
