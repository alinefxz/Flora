{% extends "base.html" %}

{% block title %}Excluir | {{ config.titulo }}{% endblock %}

{% block content %}
<section class="page-heading">
    <div>
        <p class="eyebrow">{{ config.titulo }}</p>
        <h1>Excluir registro</h1>
        <p>Essa ação remove o item selecionado do sistema.</p>
    </div>
</section>

<section class="panel danger-panel">
    <h2>Tem certeza?</h2>
    <p>Você está prestes a excluir:</p>
    <strong>{{ obj }}</strong>

    <form method="post" class="form-actions">
        {% csrf_token %}
        <button type="submit" class="btn-danger">Excluir</button>
        <a href="{% url 'saude:lista' slug %}" class="btn-ghost">Cancelar</a>
    </form>
</section>
{% endblock %}
