{% extends "base.html" %}

{% block title %}Excluir | FLORA{% endblock %}

{% block content %}
<section class="delete-panel">
    <p class="overline">{{ config.titulo }}</p>
    <h1>Excluir registro?</h1>
    <p>
        O registro <strong>{{ objeto }}</strong> será removido
        permanentemente.
    </p>

    <form method="post" class="form-actions">
        {% csrf_token %}
        <a href="{% url 'saude:lista' slug %}">Cancelar</a>
        <button type="submit" class="danger-button">
            Excluir
        </button>
    </form>
</section>
{% endblock %}
